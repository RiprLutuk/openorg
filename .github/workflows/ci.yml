name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
          - name: web
            dockerfile: apps/web/Dockerfile
          - name: cms
            dockerfile: apps/cms/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: openorg-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  production-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          POSTGRES_PASSWORD=ci_database_password_1234567890 \
          SESSION_SECRET=ci_session_secret_12345678901234567890 \
          DEFAULT_ORGANIZATION_SLUG=demo \
          WEB_DOMAIN=web.example.test \
          CMS_DOMAIN=cms.example.test \
          API_DOMAIN=api.example.test \
          TLS_EMAIL=ops@example.test \
          docker compose -f docker-compose.production.yml config --quiet
